<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Мои любимые фильмы/сериалы</title>
<style>
  :root {
    --bg: #d4d3d3;
    --surface: #d4d3d3;
    --line: #070707;
    --text: #070707;
    --muted: #070707;
    --accent: #070707;
    color-scheme: dark;
  }
  * { box-sizing: border-box; }
  html { scroll-behavior: smooth; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: "Segoe UI", system-ui, -apple-system, Roboto, sans-serif;
    line-height: 1.5;
  }
  header {
    padding: 56px 24px 24px;
    max-width: 1200px;
    margin: 0 auto;
  }
  h1 {
    margin: 0 0 8px;
    font-family: Georgia, "Times New Roman", serif;
    font-size: clamp(2rem, 6vw, 3.4rem);
    font-weight: 700;
    letter-spacing: -0.02em;
  }
  .count { margin: 0; color: var(--muted); }
  .controls {
    position: sticky;
    top: 0;
    z-index: 5;
    background: var(--bg);
    border-bottom: 1px solid var(--line);
  }
  .controls-inner {
    max-width: 1200px;
    margin: 0 auto;
    padding: 14px 24px;
    display: flex;
    gap: 12px;
    flex-wrap: wrap;
  }
  input, select {
    font: inherit;
    color: var(--text);
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 8px;
    padding: 10px 14px;
    min-height: 44px;
  }
  input { flex: 1 1 240px; }
  select { flex: 0 1 200px; }
  input:focus-visible, select:focus-visible, .card:focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 2px;
  }
  main {
    max-width: 1200px;
    margin: 0 auto;
    padding: 28px 24px 64px;
  }
  .grid {
    display: grid;
    grid-template-columns: repeat(3, minmax(0, 1fr));
    gap: 22px;
  }
  .card {
    display: flex;
    flex-direction: column;
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 10px;
    overflow: hidden;
  }
  .poster {
    width: 100%;
    aspect-ratio: 2 / 3;
    object-fit: cover;
    display: block;
    background: var(--line);
  }
  .poster-stub {
    width: 100%;
    aspect-ratio: 2 / 3;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 12px;
    text-align: center;
    color: var(--muted);
    background: repeating-linear-gradient(135deg, var(--line) 0 10px, var(--surface) 10px 20px);
  }
  .info { padding: 12px 14px 16px; }
  .title {
    margin: 0 0 4px;
    font-family: Georgia, "Times New Roman", serif;
    font-size: 1.05rem;
    line-height: 1.25;
  }
  .meta { margin: 0 0 4px; font-size: 0.9rem; color: var(--accent); }
  .year { margin: 0; font-size: 0.85rem; color: var(--muted); }
  .title { overflow-wrap: anywhere; }
  @media (max-width: 760px) {
    .grid { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; }
  }
  .empty {
    grid-column: 1 / -1;
    padding: 48px 0;
    text-align: center;
    color: var(--muted);
  }
  @media (max-width: 480px) {
    .grid { grid-template-columns: 1fr; gap: 14px; }
    header { padding-top: 36px; }
  }
</style>
</head>
<body>

    <p class="count" id="count"></p>

  <div class="controls">
    <div class="controls-inner">
      <input id="search" type="search" placeholder="Поиск по названию" aria-label="Поиск по названию">
      <select id="genre" aria-label="Фильтр по жанру">
        <option value="">Все жанры</option>
      </select>
    </div>
  </div>

  <main>
    <div class="grid" id="grid"></div>
  </main>

  <script>

      {"title": "Банши", "genre": "Боевик, Триллер, Драма, Криминал, Детектив", "year": "2013-2016", "poster": "images/banshee.jpg"},
      {"title": "Рик и Морти", "genre": "Мультфильм, Комедия, Фантастика, Приключения", "year": "2013-", "poster": "images/RAM.jpg"},
      {"title": "Общество мёртвых поэтов", "genre": "Драма", "year": "1989", "poster": "images/DPS.jpg"},
      {"title": "Укрась прощальное утро цветами обещания ", "genre": "Аниме, Драма, Мелодрама, Приключения, Фэнтези", "year": "2018", "poster": "images/УПУЦО.jpg"},
      {"title": "Семь", "genre": "Триллер", "year": "1995", "poster": "images/7.jpg"},

      {"title": "Малышка на миллион", "genre": "Спортивная драма", "year": "	2004", "poster": "images/MDB.jpg"},
      {"title": "Большой куш", "genre": "Криминал, Комедия, Боевик", "year": "2000", "poster": "images/snatch.jpg"},
      {"title": "Олдбой", "genre": "Триллер, Боевик", "year": "2003", "poster": "images/OB.jpg"},
      {"title": "Лицо со шрамом", "genre": "Драма, Криминал, Боевик", "year": "1983", "poster": "images/SF.jpg"},
      {"title": "Зеленая книга", "genre": "Биография, Комедия, Драма", "year": "2018", "poster": "images/GB.jpg"},
      {"title": "Темный рыцарь", "genre": "Фантастика, Боевик, Триллер, Криминал, Драма", "year": "2008", "poster": "images/batman.jpg"},
    ];


    movies.forEach((movie, index) => {
      movie.number = index + 1;

      movie.genres = movie.genre.split(",").map(g => g.trim()).filter(Boolean);
    });

    const grid = document.getElementById("grid");
    const search = document.getElementById("search");
    const genreSelect = document.getElementById("genre");
    const count = document.getElementById("count");

    const genres = [...new Set(movies.flatMap(m => m.genres))]
      .sort((a, b) => a.localeCompare(b, "ru"));
    genres.forEach(g => {
      const option = document.createElement("option");
      option.value = g;
      option.textContent = g;
      genreSelect.appendChild(option);
    });

    function makeCard(movie) {
      const card = document.createElement("article");
      card.className = "card";

      const img = document.createElement("img");
      img.className = "poster";
      img.src = movie.poster;
      img.alt = "Постер: " + movie.title;
      img.loading = "lazy";
      img.addEventListener("error", () => {
        const stub = document.createElement("div");
        stub.className = "poster-stub";
        stub.textContent = "Постер " + movie.title.replace(/^\D+/, "");
        img.replaceWith(stub);
      });

      const info = document.createElement("div");
      info.className = "info";

      const title = document.createElement("h2");
      title.className = "title";
      title.textContent = "№" + movie.number + ". " + movie.title;

      const genre = document.createElement("p");
      genre.className = "meta";
      genre.textContent = movie.genre.trim();

      const year = document.createElement("p");
      year.className = "year";
      year.textContent = movie.year.trim();
      
      info.append(title, genre, year);
      card.append(img, info);
      return card;
    }

    function render() {
      const query = search.value.trim().toLowerCase();
      const genre = genreSelect.value;
      const filtered = movies.filter(m =>
        (!genre || m.genres.includes(genre)) &&
        (!query || m.title.toLowerCase().includes(query))
      );

      grid.replaceChildren();
      if (filtered.length === 0) {
        const empty = document.createElement("p");
        empty.className = "empty";
        empty.textContent = "Ничего не найдено. Измени запрос или выбери другой жанр.";
        grid.appendChild(empty);
      } else {
        const fragment = document.createDocumentFragment();
        filtered.forEach(m => fragment.appendChild(makeCard(m)));
        grid.appendChild(fragment);
      }
      count.textContent = "Показано " + filtered.length + " из " + movies.length;
    }

    search.addEventListener("input", render);
    genreSelect.addEventListener("change", render);
    render();
  </script>
</body>
</html>
